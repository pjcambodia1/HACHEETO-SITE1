<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Successful • Hacheeto Store</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-stone-800 flex items-center justify-center min-h-screen">
  <main class="bg-white border border-amber-200 rounded-3xl shadow-md p-8 max-w-lg text-center">
    <div class="text-4xl mb-3">🎉</div>
    <h1 class="text-3xl font-extrabold mb-2">Thank you for your purchase!</h1>
    <p class="text-stone-700 mb-4">Your payment was successful. Stripe emailed you a receipt.</p>

    <div id="ref" class="text-xs text-stone-500 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 mx-auto mb-5 hidden"></div>

    <div class="text-left bg-amber-50/60 border border-amber-200 rounded-2xl p-4 mb-5">
      <p class="text-sm text-stone-700">Questions about shipping or pickup?</p>
      <ul class="mt-2 text-sm text-stone-700 list-disc pl-5">
        <li>Email: <a href="mailto:info@hacheeto.com" class="text-amber-700 underline">info@hacheeto.com</a></li>
        <li>WhatsApp: <a class="text-amber-700 underline" href="https://wa.me/19103728325" target="_blank" rel="noopener">+1 910 372-8325</a></li>
      </ul>
    </div>

    <div class="flex gap-3 justify-center">
      <a href="products.html" class="bg-amber-600 text-white px-5 py-2 rounded-xl hover:bg-amber-700">🛍️ Continue Shopping</a>
      <a href="index.html" class="px-5 py-2 rounded-xl border border-amber-300 text-amber-700 hover:bg-amber-50">← Home</a>
    </div>

    <p class="mt-6 text-xs text-stone-500">Tip: Save this page or your email receipt for your records.</p>
  </main>

  <script>
    // Show Stripe session id if present
    const sid = new URLSearchParams(location.search).get("session_id");
    if (sid) {
      const el = document.getElementById("ref");
      el.textContent = `Order reference: ${sid}`;
      el.classList.remove("hidden");
    }
  </script>
</body>
</html>
